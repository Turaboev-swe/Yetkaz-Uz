name: yetkaz

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: yetkaz-app:local
  user: "${UID:-1000}:${GID:-1000}"
  # .env konteyner ENV sifatida INJECT QILINMAYDI — Laravel uni bind-mount qilingan
  # /app/.env fayldan o'zi o'qiydi. Aks holda phpunit.xml dagi test override'lari
  # (APP_ENV=testing, DB_DATABASE=yetkaz_test) $_SERVER tomonidan bloklanadi.
  volumes:
    - ./:/app
    - vendor:/app/vendor
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # --- Octane (RoadRunner) HTTP server ---
  app:
    <<: *app
    # Ishga tushishда idempotent sozlash: filament:assets, storage:link, seed rasmlar.
    entrypoint: ["sh", "docker/php/entrypoint.sh"]
    command: php artisan octane:start --server=roadrunner --host=0.0.0.0 --port=8000
    ports:
      - "${APP_FORWARD_PORT:-8010}:8000"

  # --- Navbat ishchilari: Laravel Horizon ---
  horizon:
    <<: *app
    command: php artisan horizon
    ports: []
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- WebSocket: Laravel Reverb ---
  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_FORWARD_PORT:-8080}:8080"

  # --- Rejalashtiruvchi (cron) ---
  scheduler:
    <<: *app
    command: php artisan schedule:work
    ports: []

  # --- Telegram bot: long polling (lokal muhit) ---
  # DIQQAT: Telegram bir vaqtda faqat BITTA long polling ulanishiga ruxsat beradi.
  # Bu konteyner ishlab turганda qo'lda `php artisan nutgram:run` ISHLATMANG —
  # aks holda Telegram 409 Conflict qaytaradi.
  # Kod o'zgarsa: `docker compose restart bot`.
  bot:
    <<: *app
    command: php artisan nutgram:run
    ports: []
    restart: unless-stopped
    stop_grace_period: 15s

  # --- PostgreSQL 16 + PostGIS ---
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_DATABASE:-yetkaz}
      POSTGRES_USER: ${DB_USERNAME:-yetkaz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_FORWARD_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-yetkaz} -d ${DB_DATABASE:-yetkaz}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Redis (navbat / kesh / sessiya / savat) ---
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_FORWARD_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Mini App: Vite dev server (React) ---
  # Blade `/app` @vite orqali shu serverdan asset oladi (public/hot mavjud bo'lsa).
  # `profiles: [dev]` — `docker compose up -d` bilan AVTOMAT ko'tarilmaydi, chunki
  # dev server faqat localhost:${VITE_FORWARD_PORT} ga ishora qiladi (telefonda
  # ko'rinmaydi). Kompyuter brauzerida ishlash uchun: `docker compose up -d vite`.
  # Telegram testi uchun: `docker compose stop vite && npm run build`.
  vite:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      VITE_PORT: "${VITE_FORWARD_PORT:-5174}"
    volumes:
      - ./:/app
    ports:
      - "${VITE_FORWARD_PORT:-5174}:5173"
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

  # --- Print agent (oshxona kompyuteri) — FAQAT lokal sinov uchun ---
  # Haqiqiy oshxonada kompyuterда to'g'ridан-to'g'ri `python agent.py` ishlaydi.
  # `profiles: [agent]` — `docker compose --profile agent up print-agent`.
  print-agent:
    image: python:3.12-slim
    profiles: ["agent"]
    working_dir: /agent
    volumes:
      - ./print-agent:/agent
    environment:
      BACKEND_URL: http://app:8000
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      REVERB_APP_KEY: "${REVERB_APP_KEY:-local-key}"
      RESTAURANT_ID: "${PRINT_AGENT_RESTAURANT_ID:-5}"
      AGENT_TOKEN: "${PRINT_AGENT_TOKEN:-dev-burgergrill-print-token-123}"
      PRINTER_MODE: "${PRINTER_MODE:-simulate}"
    command: sh -c "pip install -q -r requirements.txt && python agent.py"
    depends_on:
      - reverb
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  vendor:
