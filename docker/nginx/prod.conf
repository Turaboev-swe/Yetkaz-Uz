# Yetkaz — production reverse proxy (HTTP, port 80).
#
# HOZIRCHA: faqat HTTP. Domen tasdiqlanib SSL qo'shilganda:
#   - `listen 443 ssl;` server bloki + certbot / Caddy
#   - `X-Forwarded-Proto` avtomat `https` bo'ladi (Laravel trustProxies '*')
#   - Reverb websocket frontend'da `wsPath: '/reverb'` bilan ulanadi

upstream octane {
    server app:8000;
    keepalive 32;
}

upstream reverb {
    server reverb:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # php.ini: post_max_size = 25M
    client_max_body_size 25m;

    # Xavfsizlik sarlavhalari (SSL bosqichida HSTS ham qo'shiladi)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel Reverb (WebSocket). Frontend hali ulanmagan — SSL bosqichida
    # VITE_REVERB_* + Echo `wsPath` sozlanadi.
    location /reverb/ {
        proxy_pass http://reverb/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://octane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Octane/RoadRunner keep-alive
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Health check (Laravel `/up`) — log'ga yozilmasin
    location = /up {
        proxy_pass http://octane;
        proxy_set_header Host $host;
        access_log off;
    }
}
