# Yetkaz — production reverse proxy (HTTPS).
#
# Faollashtirish: SSL sertifikat olingach `.env` da NGINX_CONF=prod-ssl.conf.
# Sertifikat: /etc/letsencrypt/live/yetqaz.uz/ (letsencrypt volume).

upstream octane {
    server app:8000;
    keepalive 32;
}

upstream reverb {
    server reverb:8080;
}

# --- HTTP :80 — ACME challenge + hammasini HTTPS ga yo'naltirish ---
server {
    listen 80;
    listen [::]:80;
    server_name yetqaz.uz www.yetqaz.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Konteyner healthcheck — :80 da, redirectsiz (docker-compose.prod.yml)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yetqaz.uz www.yetqaz.uz;

    ssl_certificate     /etc/letsencrypt/live/yetqaz.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yetqaz.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # php.ini: post_max_size = 25M
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # www -> apex
    if ($host = www.yetqaz.uz) {
        return 301 https://yetqaz.uz$request_uri;
    }

    # Laravel Reverb (WebSocket) — frontend `wsPath: '/reverb'` bilan ulanadi
    location /reverb/ {
        proxy_pass http://reverb/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://octane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location = /up {
        proxy_pass http://octane;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }
}
